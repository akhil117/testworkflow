
name: Step Outputs Demo

on: workflow_dispatch

jobs:
  demo:
    runs-on: ubuntu-latest

    steps:
      - name: Step A - Create Output
        id: worker_a
        run: echo "fruit=apple" >> "$GITHUB_OUTPUT"

      - name: Step B - Read Output
        id: worker_b
        run: |
          MYFRUIT="${{ steps.worker_a.outputs.fruit }}"
          echo "Fruit: $MYFRUIT"
